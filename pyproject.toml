[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handpiano"
version = "0.3.0"
description = "Instrumento virtual controlado mediante visión por computador (aplicación de escritorio)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Brings opencv-contrib-python (cv2) as a dependency; do NOT add opencv-python too,
    # two packages providing cv2 conflict.
    "mediapipe>=0.10.20",
    "numpy>=1.26",
    # Essentials only: QtWidgets/QtGui/QtCore. The full "PySide6" meta-package adds
    # ~500 MB including QtWebEngine (a Chromium), which this app does not use.
    "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
handpiano = "handpiano.app.main:main"

[tool.setuptools.packages.find]
include = ["handpiano*"]

[tool.setuptools.package-data]
"handpiano.ui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
